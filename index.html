<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hameed's Bistro - Menu & Ordering System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- TOP HEADER -->
    <header class="customer-header">
        <!-- Left Drawer Toggle Button -->
        <button id="menuBtn" class="header-btn" title="Open Menu">☰</button>

        <!-- Right Header Action Buttons -->
        <div class="header-actions">
            <button id="languageBtn" class="header-btn" title="Change Language">🌐 EN</button>
            
            <a href="cart.html" style="text-decoration: none;">
                <button id="cartBtn" class="header-btn" title="View Cart">
                    🛒 <span id="cartCount">0</span>
                </button>
            </a>

            <a href="login.html" style="text-decoration: none;">
                <button id="loginBtn" class="header-btn" title="User Account">👤</button>
            </a>

            <button id="refreshBtn" class="header-btn" title="Reload Page">🔄</button>
        </div>
    </header>

    <!-- SIDE DRAWER MENU (Information Only) -->
    <div id="sideMenu" class="side-menu">
        <button id="closeMenu">✕</button>
        <h3>Information</h3>
        <a href="customer/profile.html">Company Profile</a>
        <a href="customer/popular.html">Popular Top 15 Items</a>
        <a href="customer/order-history.html">My Orders</a>
        <a href="#">Contact Us</a>
        <a href="login.html" style="text-decoration: none;">
            <button id="menuLoginBtn">👤 Login / Register</button>
        </a>
    </div>

    <!-- 6 LANGUAGES SELECTION DROPDOWN -->
    <div id="languageBox" class="language-box">
        <button data-lang="en">English</button>
        <button data-lang="ms">Malay (Bahasa Melayu)</button>
        <button data-lang="ta">Tamil (தமிழ்)</button>
        <button data-lang="zh">Chinese (中文)</button>
        <button data-lang="hi">Hindi (हिंदी)</button>
        <button data-lang="bn">Bengali (বাংলা)</button>
    </div>

    <!-- MAIN WELCOME / HOME CONTAINER -->
    <main class="home-container">
        <div class="logo-area">
            <img src="images/logo.png" alt="Hameed's Bistro Logo" class="restaurant-logo">
            <h1>Hameed's Bistro</h1>
            <h2>Menu & Ordering System</h2>
        </div>

        <div class="home-order-buttons">
            <button id="dineInBtn" class="main-btn">Dine In</button>
            <button id="takeAwayBtn" class="main-btn">Take Away</button>
        </div>
    </main>

    <footer>
        Copyright © Prokash Rakshit
    </footer>

    <script type="module" src="js/index.js"></script>
</body>

</html>
