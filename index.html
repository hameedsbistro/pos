<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Food Ordering System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TOP HEADER WITH HOME & BACK NAVIGATION -->
    <header class="customer-header">
        <div style="display: flex; gap: 8px; align-items: center;">
            <button id="menuBtn" class="header-btn">☰</button>
            <button onclick="window.history.back()" class="header-btn" title="Go Back">⬅️</button>
            <a href="index.html" class="header-btn" title="Go Home" style="text-decoration: none;">🏠</a>
        </div>

        <div class="header-actions">
            <button id="languageBtn" class="header-btn">🌐 EN</button>
            <button id="refreshBtn" class="header-btn" onclick="window.location.reload()">🔄</button>
            <a href="cart.html" class="header-btn" style="text-decoration: none;">🛒 <span id="cartCount">0</span></a>
        </div>
    </header>

    <!-- SIDE DRAWER NAVIGATION MENU -->
    <div id="sideMenu" class="side-menu">
        <button id="closeMenu">✕</button>
        <h3>Navigation</h3>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">View Cart</a>
        <a href="orders.html">My Orders</a>
        <!-- Popular Items চাপলে সরাসরি menu.html-এ নিয়ে যাবে যেখানে Top 15 শো করে -->
        <a href="menu.html">Popular Items</a>
        
        <!-- User Auth Links -->
        <div id="userLoggedInMenu" class="hidden">
            <a href="profile.html">My Profile</a>
            <button id="logoutBtn" class="side-btn logout-bg">Logout</button>
        </div>
        <div id="userLoggedOutMenu">
            <a href="login.html" class="side-btn">Login / Register</a>
        </div>
    </div>

    <!-- LANGUAGE SELECTION POPUP DROPDOWN -->
    <div id="languageBox" class="language-box">
        <button data-lang="en">English</button>
        <button data-lang="bn">বাংলা</button>
        <button data-lang="ms">Bahasa Melayu</button>
        <button data-lang="zh">中文</button>
        <button data-lang="ta">தமிழ்</button>
        <button data-lang="hi">হিন্দি</button>
    </div>

    <!-- MAIN HOME CONTAINER -->
    <div class="main-container">
        
        <!-- LOGO AND WELCOME BANNER -->
        <div class="welcome-section">
            <img src="images/logo.png" alt="Restaurant Logo" class="restaurant-logo" onerror="this.src='https://via.placeholder.com/120?text=Logo'">
            <h1 class="restaurant-title">Welcome to Our Restaurant</h1>
            <p class="tagline">Please select your order type to continue</p>
        </div>

        <!-- DINE IN / TAKE AWAY ORDER TYPE SELECTION BUTTONS -->
        <div class="order-type-container">
            <button id="dineInBtn" class="order-type-btn dine-in">
                <span class="btn-icon">🍽️</span>
                <span class="btn-text">Dine In</span>
            </button>
            
            <button id="takeAwayBtn" class="order-type-btn take-away">
                <span class="btn-icon">🛍️</span>
                <span class="btn-text">Take Away</span>
            </button>
        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Food Ordering System. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT MODULE INCLUDE -->
    <script type="module" src="js/index.js"></script>
</body>
</html>
