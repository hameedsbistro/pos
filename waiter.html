<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Waiter Panel - Hameed's Bistro
</title>


<link rel="stylesheet" href="css/waiter.css">

</head>


<body>





<header class="waiter-header">


<div class="brand">

<h1>
Hameed's Bistro
</h1>

<h3>
Waiter Panel
</h3>

</div>





<div class="user-info">

<p>
Welcome:
<span id="userName">
---
</span>
</p>


<p>
Role:
<span id="userRole">
---
</span>
</p>


</div>






<div class="controls">


<button id="refreshBtn">

🔄 Refresh

</button>



<button id="logoutBtn">

Logout

</button>


</div>


</header>








<!-- TABLE SELECT -->


<section class="table-section">


<h2>
Select Table
</h2>


<select id="tableSelect">


<option value="">

Select Table

</option>


<option>
Indoor A1
</option>


<option>
Indoor A2
</option>


<option>
Indoor A3
</option>


<option>
Outdoor B1
</option>


<option>
Outdoor B2
</option>


<option>
First Floor C1
</option>


</select>


</section>










<!-- MENU -->


<section>


<h2 style="padding-left:20px">

Menu

</h2>



<div id="menuContainer"
class="menu-container">


<!-- Menu Load Here -->


</div>



</section>









<!-- CART -->


<section class="cart-section">


<h2>

Current Order

</h2>



<div id="cartContainer">


<!-- Cart Items -->

</div>






<button id="sendOrderBtn"
class="send-btn">


Send Order To Cashier


</button>



</section>









<script type="module" src="js/waiter.js"></script>


</body>


</html>
