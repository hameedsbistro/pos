<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Waiter Panel - Hameed's Bistro
</title>


<link rel="stylesheet" href="css/waiter.css">

</head>


<body>


<header class="waiter-header">


<div class="brand">

<h1>
Hameed's Bistro
</h1>

<h3>
Waiter Panel
</h3>

</div>




<div class="user-box">

<p>
Welcome:
<span id="userName">---</span>
</p>


<p>
Role:
<span id="userRole">---</span>
</p>

</div>





<div class="header-btns">


<button id="refreshBtn">
🔄 Refresh
</button>


<button id="logoutBtn">
Logout
</button>


</div>


</header>







<main>


<h2>
Tables
</h2>


<section class="table-section">


<h3>
Indoor
</h3>


<div id="indoorTables"
class="table-grid">
</div>


</section>







<section class="table-section">


<h3>
Outdoor
</h3>


<div id="outdoorTables"
class="table-grid">
</div>


</section>







<section class="table-section">


<h3>
First Floor
</h3>


<div id="floorTables"
class="table-grid">
</div>


</section>




</main>









<!-- ORDER MODAL -->


<div id="orderModal"
class="modal">


<div class="modal-box">


<button id="closeBtn"
class="close">
✕
</button>


<h2>
Table:
<span id="selectedTable">
---
</span>

</h2>





<div class="menu-area">

<h3>
Menu
</h3>


<div id="menuItems">

</div>


</div>







<div class="cart-area">


<h3>
Order Items
</h3>


<div id="orderItems">

</div>


</div>







<textarea

id="orderNote"

placeholder="Item Note">

</textarea>





<button id="sendOrderBtn">

Send Order

</button>



</div>


</div>






<script type="module" src="js/waiter.js"></script>


</body>

</html>
