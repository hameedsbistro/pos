<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Waiter Panel - Hameed's Bistro
</title>


<link rel="stylesheet" href="css/waiter.css">


</head>


<body>


<!-- HEADER -->

<header class="waiter-header">


<div class="brand">

<h1>
Hameed's Bistro
</h1>


<h3>
Waiter Panel
</h3>

</div>





<div class="user-info">


<p>
Welcome:
<span id="userName">
---
</span>
</p>



<p>
Role:
<span id="userRole">
---
</span>
</p>



</div>






<div class="controls">


<button id="refreshBtn">
🔄 Refresh
</button>



<button id="logoutBtn">
Logout
</button>


</div>



</header>









<!-- TABLE AREA -->


<section class="table-section">


<h2>
Tables
</h2>



<div id="tableGrid" class="table-grid">


<!-- Tables Load Here -->



</div>



</section>









<!-- ORDER MODAL -->


<div id="orderPanel" class="order-panel">



<div class="order-header">


<h2>
Table Order
</h2>



<button id="closeOrderBtn">
✕
</button>


</div>







<div class="order-content">





<!-- MENU -->

<div class="menu-side">


<h3>
Menu
</h3>


<div id="menuItems">


</div>


</div>







<!-- CART -->

<div class="cart-side">


<h3>
Current Order
</h3>



<div id="orderItems">


</div>





<textarea 
id="itemNote"
placeholder="Item Note">

</textarea>






<button id="sendOrderBtn">

Send Order

</button>



</div>





</div>


</div>









<script type="module" src="js/waiter.js"></script>


</body>

</html>
