<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Waiter Panel - Hameed's Bistro
</title>

<link rel="stylesheet" href="css/waiter.css">

</head>


<body>


<header class="waiter-header">


<div class="brand">

<h1>
Hameed's Bistro
</h1>

<h3>
Waiter Panel
</h3>

</div>



<div class="user-info">

<p>
Welcome:
<span id="userName">---</span>
</p>

<p>
Role:
<span id="userRole">---</span>
</p>

</div>



<div class="controls">


<button id="refreshBtn">
🔄 Refresh
</button>


<button id="logoutBtn">
Logout
</button>


</div>


</header>





<main class="waiter-container">



<h2>
Table Status
</h2>




<div id="tableGrid" class="table-grid">

<!-- Tables Load Here -->

</div>



</main>





<!-- ORDER PANEL -->


<div id="orderPanel" class="order-panel">


<h2>
Create Order
</h2>


<h3 id="selectedTable">
Table:
</h3>



<div id="menuItems">

</div>



<div id="cartItems">

</div>



<textarea 
id="itemNote"
placeholder="Order Note">
</textarea>




<button id="sendOrderBtn">
Send Order
</button>



<button id="closeOrderBtn">
Close
</button>



</div>






<script type="module" src="js/waiter.js"></script>


</body>

</html>
