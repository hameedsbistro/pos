<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>
Hameed's Bistro
</title>



<link rel="stylesheet" href="css/style.css">



</head>





<body>





<header class="top-header">





<div class="top-actions">



<button id="refreshBtn">
🔄
</button>





<button id="languageBtn">
🌐
</button>





<button id="loginBtn">
👤
</button>



</div>





</header>









<main class="welcome-page">





<div class="logo-area">





<img 

src="images/logo.png"

class="restaurant-logo"

alt="Logo"

>








<h1>

Hameed's Bistro

</h1>







<h2 data-i18n="menuOrderSystem">

Menu & Ordering System

</h2>





</div>









<div class="main-buttons">





<button class="main-btn"

onclick="location.href='menu.html'">


🍽️

<span data-i18n="menu">

Menu

</span>


</button>








<button class="main-btn"

onclick="location.href='menu.html?type=dinein'">


🪑

<span data-i18n="dineIn">

Dine In

</span>


</button>








<button class="main-btn"

onclick="location.href='menu.html?type=takeaway'">


🥡

<span data-i18n="takeAway">

Take Away

</span>


</button>








<button class="main-btn"

onclick="location.href='cart.html'">


🛒

<span data-i18n="cart">

Cart

</span>


</button>





</div>









</main>









<script type="module">



import {

applyLanguage

}

from "./js/translation.js";




applyLanguage();





document.getElementById(
"refreshBtn"
)

.onclick=()=>{


location.reload();


};






document.getElementById(
"languageBtn"
)

.onclick=()=>{


location.href="language.html";


};






document.getElementById(
"loginBtn"
)

.onclick=()=>{


location.href="login.html";


};



</script>







</body>


</html>
