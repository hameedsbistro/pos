<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Kitchen Display System
</title>


<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet" href="../css/kitchen.css">


</head>



<body>



<header class="admin-header">


<div class="admin-title">


<h2>
🍳 Kitchen Display System
</h2>


</div>




<div class="admin-actions">


<button id="refreshBtn">
🔄
</button>



<button onclick="history.back()">
←
</button>


</div>


</header>









<main class="kitchen-container">



<h1>
Kitchen Orders
</h1>







<!-- SECTION FILTER -->


<div class="kitchen-filter">


<label>

<input 
type="checkbox"
class="section-check"
value="Main Kitchen"
checked>


Main Kitchen

</label>




<label>

<input 
type="checkbox"
class="section-check"
value="Tandoor">


Tandoor

</label>




<label>

<input 
type="checkbox"
class="section-check"
value="Drinks">


Drinks

</label>




<label>

<input 
type="checkbox"
class="section-check"
value="Dessert">


Dessert

</label>




<label>

<input 
type="checkbox"
class="section-check"
value="Packing">


Packing

</label>



</div>









<!-- ORDER COLUMNS -->


<div class="kitchen-board">






<!-- NEW -->


<div class="kitchen-column new">


<h2>
🟠 New
</h2>


<div id="newOrders">

</div>


</div>









<!-- PREPARING -->


<div class="kitchen-column preparing">


<h2>
🟣 Preparing
</h2>



<div id="preparingOrders">

</div>


</div>









<!-- READY -->


<div class="kitchen-column ready">


<h2>
🟢 Ready
</h2>



<div id="readyOrders">

</div>


</div>







</div>








</main>









<script type="module" src="../js/kitchen.js"></script>


</body>


</html>
