<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Kitchen Display - Hameed's Bistro
</title>


<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet" href="../css/kitchen.css">


</head>



<body>



<header class="admin-header">



<div class="admin-title">


<h2>
Hameed's Bistro
</h2>


<h3>
Kitchen Display
</h3>


</div>







<div class="kitchen-user-panel">



<span>
Welcome:
<b id="userName"></b>
</span>



<span>
Role:
<b id="userRole"></b>
</span>





<button id="checkInBtn">

Check In

</button>





<button id="checkOutBtn">

Check Out

</button>





<button id="logoutBtn">

Logout

</button>



</div>







<div class="admin-actions">


<button id="refreshBtn">

🔄

</button>



<button onclick="history.back()">

←

</button>



</div>



</header>









<main class="kitchen-container">





<!-- SECTION SELECT -->


<div class="kitchen-section-select">


<label>

Select Section

</label>



<select id="sectionSelect">


<option value="">

Select Section

</option>


</select>



</div>









<!-- KITCHEN STATUS BOARD -->


<div class="kitchen-board">







<!-- NEW ORDER -->


<div class="kitchen-column">


<h2>
🟠 New Order
</h2>



<div id="newOrders">


</div>


</div>









<!-- PREPARING -->


<div class="kitchen-column">


<h2>
🟣 Preparing
</h2>



<div id="preparingOrders">


</div>


</div>









<!-- READY -->


<div class="kitchen-column">


<h2>
🟢 Ready
</h2>



<div id="readyOrders">


</div>


</div>









<!-- COMPLETED -->


<div class="kitchen-column">


<h2>
✅ Completed
</h2>



<div id="completedOrders">


</div>


</div>







</div>








</main>









<script 
type="module"
src="../js/kitchen-auth.js">
</script>



<script 
type="module"
src="../js/kitchen-attendance.js">
</script>



<script 
type="module"
src="../js/kitchen.js">
</script>





</body>


</html>
