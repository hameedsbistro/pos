<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Settings - Hameed's Bistro
</title>


<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet" href="../css/settings.css">


</head>



<body>




<header class="admin-header">


<div class="admin-title">

<h2>
System Settings
</h2>

</div>





<div class="admin-actions">


<button id="refreshBtn">
🔄
</button>



<button onclick="history.back()">
←
</button>


</div>


</header>









<main class="admin-container">



<h1>
Settings
</h1>









<!-- LANGUAGE SETTINGS -->


<div class="settings-card">



<h3>
Language Settings
</h3>





<select id="defaultLanguage">


<option value="en">
English
</option>



<option value="ms">
Malay
</option>



<option value="bn">
বাংলা
</option>



<option value="hi">
हिन्दी
</option>



<option value="ta">
தமிழ்
</option>



<option value="zh">
中文
</option>



</select>






<button id="saveLanguageBtn">

Save Language

</button>




</div>









<!-- RESTAURANT INFORMATION -->


<div class="settings-card">



<h3>
Restaurant Information
</h3>







<input

type="text"

value="Hameed's Bistro"

readonly>





<p>
Restaurant Name cannot be changed
</p>




</div>









<!-- KITCHEN SETTINGS -->


<div class="settings-card">



<h3>
Kitchen Settings
</h3>



<p>
Manage Kitchen Display Sections and Categories
</p>









<div class="setting-group">


<label>
Select Section
</label>


<select id="sectionSelect">


<option value="">
Select Section
</option>


</select>


</div>









<div class="setting-group">


<label>
Select Category
</label>



<div id="categoryList">


Loading categories...


</div>



</div>









<button id="saveKitchenMappingBtn">

Save Kitchen Mapping

</button>






<hr>








<h3>
Add New Section
</h3>




<input

type="text"

id="newSectionName"

placeholder="New Section Name">





<button id="addSectionBtn">

Add New Section

</button>







</div>









</main>









<script 
type="module"
src="../js/settings.js">
</script>



<script 
type="module"
src="../js/kitchen-settings.js">
</script>





</body>


</html>
