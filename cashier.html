<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Cashier Panel - Hameed's Bistro
</title>


<link rel="stylesheet" href="css/cashier.css">


</head>


<body>


<!-- HEADER -->

<header class="cashier-header">


<div class="brand">

<h1>
Hameed's Bistro
</h1>

<h3>
Cashier Panel
</h3>

</div>




<div class="user-info">

<p>
Welcome:
<span id="userName">
---
</span>
</p>


<p>
Role:
<span id="userRole">
---
</span>
</p>


</div>




<div class="controls">


<button id="refreshBtn">
🔄 Refresh
</button>


<button id="logoutBtn">
Logout
</button>


</div>


</header>







<!-- CURRENT ORDER PANEL -->


<section class="current-order-panel">


<div class="panel-header">


<h2>
Current Orders
</h2>



<div class="panel-buttons">


<button id="paymentBtn">
Payment
</button>


<button id="invoiceBtn">
Invoice List
</button>


<button id="newOrderBtn">
New Order
</button>



</div>


</div>








<!-- ORDER GRID -->


<div id="orderContainer" class="order-grid">


<!-- Orders load here -->

</div>



</section>










<!-- OPEN ORDER MODAL -->


<div id="orderModal" class="modal">


<div class="modal-content">


<h2>
Order Details
</h2>



<div id="selectedOrder">


</div>





<div class="modal-buttons">


<button id="addItemBtn">
Add More Item
</button>


<button id="sendOrderBtn">
Send Order
</button>


<button id="closeModalBtn">
Close
</button>


</div>



</div>


</div>









<!-- PAYMENT MODAL -->


<div id="paymentModal" class="modal">


<div class="modal-content">


<h2>
Payment
</h2>




<label>
Select Table
</label>


<select id="paymentTable">


<option value="">
Select Table
</option>


</select>





<button id="openPaymentBtn">
Open Payment
</button>




</div>


</div>









<!-- INVOICE LIST -->


<div id="invoiceModal" class="modal">


<div class="modal-content">


<h2>
Invoice List
</h2>



<div id="invoiceList">

</div>



<button id="closeInvoiceBtn">
Close
</button>


</div>


</div>









<script type="module" src="js/cashier.js"></script>


</body>


</html>
