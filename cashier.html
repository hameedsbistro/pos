<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Cashier Panel - Hameed's Bistro</title>

<link rel="stylesheet" href="css/cashier.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="cashier-header">

    <div class="brand">

        <h1>Hameed's Bistro</h1>

        <h3>Cashier Panel</h3>

    </div>


    <div class="user-info">

        <p>
            Welcome:
            <span id="userName">---</span>
        </p>

        <p>
            Role:
            <span id="userRole">---</span>
        </p>

    </div>


    <div class="controls">

        <button id="refreshBtn">
            🔄 Refresh
        </button>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</header>



<!-- =========================
     TABLE SELECTION
========================= -->

<section id="tableSection"
         class="cashier-section">

    <div class="section-header">

        <div>

            <h2>
                Select Table
            </h2>

            <p>
                Select a table to start or continue an order.
            </p>

        </div>

    </div>


    <!-- LEGEND -->

    <div class="table-legend">

        <span>
            <i class="legend-box available"></i>
            Available
        </span>

        <span>
            <i class="legend-box busy"></i>
            Busy
        </span>

    </div>


    <!-- TABLE GRID -->

    <div id="tableGrid"
         class="table-grid">

        <!-- Tables generated by cashier.js -->

    </div>

</section>



<!-- =========================
     CUSTOMER / ORDER SECTION
========================= -->

<section id="customerSection"
         class="cashier-section"
         style="display:none;">

    <div class="section-header">

        <div>

            <h2>
                Table
                <span id="selectedTableNumber">
                    ---
                </span>
            </h2>

            <p>
                Select an existing customer or create a new customer.
            </p>

        </div>


        <button id="backToTablesBtn"
                class="secondary-btn">

            ← Back to Tables

        </button>

    </div>


    <!-- EXISTING ORDERS -->

    <div id="customerOrders"
         class="customer-orders">

        <!-- Existing customer orders generated here -->

    </div>


    <!-- NEW CUSTOMER -->

    <button id="newCustomerBtn"
            class="new-customer-btn">

        + NEW CUSTOMER

    </button>

</section>



<!-- =========================
     MENU + CART
========================= -->

<section id="orderSection"
         class="cashier-section"
         style="display:none;">


    <div class="section-header">

        <div>

            <h2>
                Table
                <span id="orderTableNumber">
                    ---
                </span>
            </h2>

            <p>
                Order:
                <span id="orderNumber">
                    New Order
                </span>
            </p>

        </div>


        <button id="backToCustomersBtn"
                class="secondary-btn">

            ← Back

        </button>

    </div>



    <!-- TWO PANELS -->

    <div class="cashier-order-layout">


        <!-- =====================
             MENU PANEL
        ====================== -->

        <div class="menu-panel">


            <div class="menu-panel-header">

                <h2>
                    Menu
                </h2>


                <select id="categorySelect">

                    <option value="all">
                        Select Category
                    </option>

                </select>

            </div>


            <div id="cashierMenuContainer"
                 class="cashier-menu-grid">

                <!-- Menu generated here -->

            </div>


        </div>



        <!-- =====================
             CART PANEL
        ====================== -->

        <div class="cashier-cart-panel">


            <div class="cart-panel-header">

                <h2>
                    Current Order
                </h2>

            </div>


            <div id="cashierCartItems
