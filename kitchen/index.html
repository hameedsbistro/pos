<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Hameed's Bistro - Kitchen Display
</title>


<link rel="stylesheet" href="../css/kitchen.css">


</head>


<body>


<!-- HEADER PANEL -->

<header class="kitchen-header">


    <!-- LEFT BRAND -->

    <div class="brand-area">

        <h1>
        Hameed's Bistro
        </h1>

        <h3>
        Kitchen Display
        </h3>

    </div>





    <!-- USER INFO -->

    <div class="user-info">


        <div class="welcome-box">

            <div>
            Welcome:
            <b id="userName">
            Admin
            </b>
            </div>


            <div>
            Role:
            <b id="userRole">
            Admin
            </b>
            </div>

        </div>





        <div class="attendance-box">


            <button id="checkInBtn">
            Check In
            </button>


            <button id="checkOutBtn">
            Check Out
            </button>


        </div>



    </div>







    <!-- RIGHT ACTION -->

    <div class="action-box">


        <button id="refreshBtn">
        🔄 Refresh
        </button>


        <button id="logoutBtn">
        Logout
        </button>


        <button id="backBtn">
        ← Back
        </button>


    </div>


</header>







<!-- STATUS BUTTONS -->

<div class="status-buttons">


<button id="readyBtn">
READY
</button>


<button id="completedBtn">
COMPLETED
</button>


</div>








<!-- SECTION SELECT -->

<div class="section-select-box">


<select id="sectionSelect">

<option value="">
Select Section
</option>


</select>


</div>








<!-- DEFAULT NEW ORDER -->

<section id="newOrderView">


<h2>
NEW ORDERS
</h2>


<div 
id="newOrders"
class="order-grid">


</div>


</section>









<!-- READY VIEW -->


<section 
id="readyView"
class="hidden-view">


<h2>
READY ORDERS
</h2>


<div
id="readyOrders"
class="order-grid">


</div>


</section>









<!-- COMPLETED VIEW -->


<section 
id="completedView"
class="hidden-view">


<h2>
COMPLETED ORDERS
</h2>


<div
id="completedOrders"
class="order-grid">


</div>


</section>










<!-- JS -->

<script type="module" src="../js/kitchen-auth.js"></script>

<script type="module" src="../js/kitchen-attendance.js"></script>

<script type="module" src="../js/kitchen.js"></script>


</body>

</html>
