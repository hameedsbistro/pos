<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Hameed's Bistro Kitchen Display
</title>


<link rel="stylesheet" href="../css/kitchen.css">


</head>


<body>


<!-- ================= HEADER ================= -->


<header class="kitchen-header">


    <!-- BRAND LEFT -->

    <div class="brand-area">

        <h1>
            Hameed's Bistro
        </h1>

        <h2>
            Kitchen Display
        </h2>

    </div>





    <!-- USER AREA -->

    <div class="user-area">


        <div class="welcome-area">

            <div>
                Welcome:
                <strong id="userName">
                -
                </strong>
            </div>


            <div>
                Role:
                <strong id="userRole">
                -
                </strong>
            </div>

        </div>





        <div class="attendance-area">


            <button id="checkInBtn">
                Check In
            </button>


            <button id="checkOutBtn">
                Check Out
            </button>


        </div>



    </div>







    <!-- RIGHT CONTROL -->


    <div class="control-area">


        <button id="refreshBtn">
            Refresh
        </button>


        <button id="logoutBtn">
            Logout
        </button>


        <button id="backBtn">
            Back
        </button>


    </div>



</header>








<!-- ================= STATUS BUTTON ================= -->


<div class="status-area">


<button id="readyBtn">
READY
</button>


<button id="completedBtn">
COMPLETED
</button>


</div>








<!-- ================= SECTION ================= -->


<div class="section-area">


<select id="sectionSelect">

<option>
Select Section
</option>


</select>


</div>








<!-- ================= NEW ORDER DEFAULT ================= -->


<section id="newOrderView">


<h2>
NEW ORDERS
</h2>



<div 
id="newOrders"
class="order-grid">

</div>


</section>









<!-- ================= READY VIEW ================= -->


<section 
id="readyView"
class="hidden">


<h2>
READY ORDERS
</h2>



<div
id="readyOrders"
class="order-grid">

</div>


</section>









<!-- ================= COMPLETED VIEW ================= -->


<section
id="completedView"
class="hidden">


<h2>
COMPLETED ORDERS
</h2>



<div
id="completedOrders"
class="order-grid">

</div>


</section>










<script type="module" src="../js/kitchen-auth.js"></script>

<script type="module" src="../js/kitchen-attendance.js"></script>

<script type="module" src="../js/kitchen.js"></script>


</body>

</html>
