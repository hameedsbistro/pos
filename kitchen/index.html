<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kitchen Display</title>

<link rel="stylesheet" href="../css/kitchen.css">

</head>


<body>


<!-- HEADER PANEL -->

<header class="kitchen-header">


<div class="brand-section">

<h1>Hameed's Bistro</h1>

<h3>Kitchen Display</h3>

</div>



<div class="user-section">

<div>
Welcome:
<span id="userName">---</span>
</div>


<div>
Role:
<span id="userRole">---</span>
</div>


</div>




<div class="attendance-section">


<button id="checkInBtn">
Check In
</button>


<button id="checkOutBtn">
Check Out
</button>


</div>




<div class="control-section">


<button id="refreshBtn">
Refresh
</button>


<button id="logoutBtn">
Logout
</button>


<button id="backBtn">
Back
</button>



</div>


</header>





<!-- STATUS BUTTONS -->


<div class="status-buttons">


<button id="readyBtn">
READY
</button>


<button id="completedBtn">
COMPLETED
</button>


</div>







<!-- STATION SELECT -->


<div class="station-box">


<select id="sectionSelect">

<option value="">
Select Station
</option>


</select>


</div>







<!-- CURRENT VIEW TITLE -->


<h2 id="orderTitle">

NEW ORDERS

</h2>







<!-- ORDER DISPLAY -->


<div id="orderContainer" class="order-grid">


<!-- Orders will load here -->


</div>






<script type="module" src="../js/kitchen-auth.js"></script>

<script type="module" src="../js/kitchen-attendance.js"></script>

<script type="module" src="../js/kitchen.js"></script>

</body>


</html>
