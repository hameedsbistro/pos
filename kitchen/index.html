<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Kitchen Display - Hameed's Bistro
</title>


<link rel="stylesheet" href="../css/kitchen.css">


</head>


<body>



<header class="kitchen-header">



<div class="kitchen-brand">


<h1>
Hameed's Bistro
</h1>


<h2>
Kitchen Display
</h2>


</div>







<div class="kitchen-user-panel">


<span>
Welcome:
<b id="userName"></b>
</span>


<span>
Role:
<b id="userRole"></b>
</span>





<button id="checkInBtn">
Check In
</button>




<button id="checkOutBtn">
Check Out
</button>




<button id="logoutBtn">
Logout
</button>



</div>






<div class="kitchen-actions">


<button id="refreshBtn">
🔄
</button>


</div>



</header>









<main class="kitchen-main">





<!-- SECTION SELECT -->


<div class="section-bar">


<label>
Select Section
</label>



<select id="sectionSelect">


<option value="">
Select Section
</option>


</select>



</div>









<!-- NEW ORDERS -->


<section class="new-order-section">


<h2>
New Orders
</h2>



<div id="newOrders" class="order-grid">


</div>


</section>









<!-- READY COMPLETED BUTTON -->


<div class="status-menu">


<button id="readyBtn">

Ready Orders

</button>




<button id="completedBtn">

Completed Orders

</button>



</div>








<!-- READY VIEW -->


<section id="readyView" class="hidden-view">


<h2>
Ready Orders
</h2>


<div id="readyOrders" class="order-grid">


</div>


</section>









<!-- COMPLETED VIEW -->


<section id="completedView" class="hidden-view">


<h2>
Completed Orders
</h2>


<div id="completedOrders" class="order-grid">


</div>


</section>








</main>









<script type="module" src="../js/kitchen-auth.js"></script>


<script type="module" src="../js/kitchen-attendance.js"></script>


<script type="module" src="../js/kitchen.js"></script>




</body>


</html>
