<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Kitchen Display - Hameed's Bistro
</title>


<link rel="stylesheet" href="../css/kitchen.css">

</head>



<body>



<!-- TOP HEADER -->

<header class="kitchen-header">



<div class="brand-area">


<h1>
Hameed's Bistro
</h1>


<h3>
Kitchen Display
</h3>


</div>







<div class="user-area">


<div class="welcome-box">


<span>
Welcome:
</span>

<b id="userName">
Admin
</b>


<br>


<span>
Role:
</span>

<b id="userRole">
admin
</b>


</div>





<div class="attendance-box">


<button id="checkInBtn">
Check In
</button>



<button id="checkOutBtn">
Check Out
</button>


</div>







<div class="action-box">


<button id="logoutBtn">
Logout
</button>


<button id="refreshBtn">
🔄
</button>



<button onclick="history.back()">
←
</button>


</div>



</div>





</header>









<!-- STATUS BUTTON -->

<div class="status-buttons">


<button id="readyBtn">

Ready

</button>



<button id="completedBtn">

Completed

</button>



</div>









<!-- SECTION SELECT -->

<div class="section-control">


<select id="sectionSelect">


<option value="">

Select Section

</option>


</select>


</div>









<!-- NEW ORDER AREA -->

<main class="order-area">


<h2>
New Orders
</h2>





<div 
id="newOrders"
class="order-grid">



</div>





</main>









<!-- READY ORDERS -->


<section 
id="readyView"
class="hidden-view">



<h2>
Ready Orders
</h2>



<div 
id="readyOrders"
class="order-grid">

</div>



</section>









<!-- COMPLETED ORDERS -->


<section 
id="completedView"
class="hidden-view">



<h2>
Completed Orders
</h2>



<div 
id="completedOrders"
class="order-grid">

</div>



</section>









<script type="module" src="../js/kitchen-auth.js"></script>

<script type="module" src="../js/kitchen-attendance.js"></script>

<script type="module" src="../js/kitchen.js"></script>



</body>

</html>
