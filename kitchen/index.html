<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kitchen Display</title>

<link rel="stylesheet" href="../css/kitchen.css">

</head>


<body>


<header class="header">


<div class="brand">
    <h1>Hameed's Bistro</h1>
    <h3>Kitchen Display</h3>
</div>


<div class="user-info">

<p>
Welcome:
<span id="userName">---</span>
</p>

<p>
Role:
<span id="userRole">---</span>
</p>

</div>



<div class="attendance">

<button id="checkInBtn">
Check In
</button>


<button id="checkOutBtn">
Check Out
</button>

</div>




<div class="controls">

<button id="refreshBtn">
Refresh
</button>


<button id="logoutBtn">
Logout
</button>


<button id="backBtn">
Back
</button>


</div>


</header>





<section class="station-area">


<label>
Kitchen Station
</label>


<select id="sectionSelect">

<option value="">
All Stations
</option>

</select>


</section>







<section class="status-area">


<button id="newBtn"
class="active">
NEW ORDERS
</button>


<button id="readyBtn">
READY
</button>


<button id="completedBtn">
COMPLETED
</button>


</section>








<h2 id="orderTitle">
NEW ORDERS
</h2>






<div id="orderContainer"
class="orders-container">


</div>








<script type="module" src="../js/kitchen.js"></script>

<script type="module" src="../js/kitchen-auth.js"></script>

<script type="module" src="../js/kitchen-attendance.js"></script>



</body>

</html>
