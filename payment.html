<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Payment - Hameed's Bistro
</title>

<link rel="stylesheet"
      href="css/payment.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="payment-header">

    <div>

        <h1>
            Hameed's Bistro
        </h1>

        <h3>
            Payment
        </h3>

    </div>


    <button id="backBtn">
        ← Back
    </button>

</header>



<!-- =========================
     PAYMENT CONTAINER
========================= -->

<main class="payment-container">


    <!-- ORDER INFORMATION -->

    <section class="payment-card">

        <div class="order-info">

            <div>

                <span>
                    Order
                </span>

                <strong id="orderNo">
                    ---
                </strong>

            </div>


            <div>

                <span>
                    Table
                </span>

                <strong id="tableNo">
                    ---
                </strong>

            </div>

        </div>

    </section>



    <!-- =========================
         ITEMS
    ========================== -->

    <section class="payment-card">

        <h2>
            Order Items
        </h2>


        <div id="paymentItems">

            <p class="loading">
                Loading...
            </p>

        </div>

    </section>



    <!-- =========================
         BILL
    ========================== -->

    <section class="payment-card">


        <div class="payment-row">

            <span>
                Subtotal
            </span>

            <strong id="subtotalAmount">
                RM 0.00
            </strong>

        </div>


        <div class="payment-row">

            <span>
                SST (6%)
            </span>

            <strong id="sstAmount">
                RM 0.00
            </strong>

        </div>


        <div class="payment-total">

            <span>
                TOTAL
            </span>

            <strong id="totalAmount">
                RM 0.00
            </strong>

        </div>


    </section>



    <!-- =========================
         ADD MORE ITEMS
    ========================== -->

    <section class="payment-card">

        <button id="addMoreItemsBtn"
                class="add-more-btn">

            + ADD MORE ITEMS

        </button>

    </section>



    <!-- =========================
         PAYMENT METHOD
    ========================== -->

    <section class="payment-card">

        <h2>
            Payment Method
        </h2>


        <div class="payment-methods">


            <button
                class="method-btn"
                data-method="Cash">

                💵 Cash

            </button>


            <button
                class="method-btn"
                data-method="DuitNow QR">

                📱 DuitNow QR

            </button>


            <button
                class="method-btn"
                data-method="Card">

                💳 Card

            </button>


        </div>


        <!-- CASH -->

        <div id="cashBox"
             class="cash-box"
             style="display:none;">

            <label for="cashAmount">

                Cash Received

            </label>


            <input
                id="cashAmount"
                type="number"
                min="0"
                step="0.01"
                placeholder="RM 0.00"
            >


            <div class="change-row">

                <span>
                    Change
                </span>

                <strong id="changeAmount">
                    RM 0.00
                </strong>

            </div>

        </div>


    </section>



    <!-- =========================
         PAY
    ========================== -->

    <section class="payment-card">

        <button id="payBtn"
                class="pay-btn">

            PAY NOW

        </button>


        <p id="message"
           class="payment-message">
        </p>

    </section>


</main>



<script type="module"
        src="js/payment.js">
</script>

</body>

  </html>
