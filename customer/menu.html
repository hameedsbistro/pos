<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Menu - Hameed's Bistro
</title>


<link rel="stylesheet" href="../css/customer-menu.css">

<link rel="stylesheet" href="../css/customer.css">


</head>


<body>



<!-- HEADER -->


<header class="customer-header">


<button class="header-btn" id="menuBtn">
☰
</button>




<div class="header-actions">


<button class="header-btn" id="backBtn">
←
</button>


<button class="header-btn" id="homeBtn">
🏠
</button>



<button class="header-btn" id="languageBtn">
🌐 EN
</button>



<button class="header-btn" id="cartBtn">
🛒
<span id="cartCount">
0
</span>
</button>



<button class="header-btn" id="loginBtn">
👤
</button>



<button class="header-btn" id="refreshBtn">
🔄
</button>



</div>


</header>







<!-- CATEGORY -->


<section class="category-section">


<div id="categoryList">

</div>


</section>







<!-- MENU ITEMS -->


<section class="menu-container">


<div id="menuItems">


<!-- Firebase Items Load Here -->


</div>



</section>







<!-- CART FLOAT BUTTON -->


<button class="floating-cart" id="floatingCart">


🛒

<span id="floatingCartCount">
0
</span>


</button>







<!-- LANGUAGE BOX -->


<div id="languageBox" class="language-box">


<button data-lang="en">
English
</button>


<button data-lang="ms">
Malay
</button>


<button data-lang="ta">
Tamil
</button>


<button data-lang="zh">
Chinese
</button>


<button data-lang="hi">
Hindi
</button>


<button data-lang="bn">
Bengali
</button>


</div>







<script type="module" src="../js/menu.js"></script>


</body>

</html>
