<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Food Ordering System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>

    <!-- TOP HEADER WITH NAVIGATION -->
    <header class="customer-header">
        <div style="display: flex; gap: 8px; align-items: center;">
            <button id="menuBtn" class="header-btn" type="button">☰</button>
            <button onclick="window.history.back()" class="header-btn" title="Go Back" type="button">⬅️</button>
            <a href="index.html" class="header-btn" title="Go Home" style="text-decoration: none;">🏠</a>
        </div>

        <div class="header-actions">
            <button id="languageBtn" class="header-btn" type="button">🌐 EN</button>
            <button id="refreshBtn" class="header-btn" type="button">🔄</button>
            <a href="cart.html" class="header-btn" style="text-decoration: none;">🛒 <span id="cartCount">0</span></a>
        </div>
    </header>

    <!-- SIDE DRAWER NAVIGATION MENU -->
    <div id="sideMenu" class="side-menu">
        <button id="closeMenu" type="button">✕</button>
        <h3>Navigation</h3>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">View Cart</a>
        <a href="history.html">My Orders</a>
        <a href="menu.html?category=popular">Popular Items</a>
        
        <div id="userLoggedInMenu" class="hidden">
            <a href="profile.html">My Profile</a>
            <button id="logoutBtn" class="side-btn logout-bg" type="button">Logout</button>
        </div>
        <div id="userLoggedOutMenu">
            <a href="login.html" class="side-btn">Login / Register</a>
        </div>
    </div>

    <!-- LANGUAGE SELECTION POPUP DROPDOWN -->
    <div id="languageBox" class="language-box">
        <button data-lang="en" type="button">English</button>
        <button data-lang="bn" type="button">বাংলা</button>
        <button data-lang="ms" type="button">Bahasa Melayu</button>
        <button data-lang="zh" type="button">中文</button>
        <button data-lang="ta" type="button">தமிழ்</button>
        <button data-lang="hi" type="button">হিন্দি</button>
    </div>

    <!-- MAIN HISTORY CONTAINER -->
    <div class="history-container">
        <div class="history-title-box">
            <h2>My Order History</h2>
        </div>
        
        <div id="ordersList">
            <!-- Supabase Data loads dynamically via Javascript -->
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Food Ordering System. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT MODULE INCLUDE -->
    <script type="module" src="js/history.js"></script>
</body>
</html>
