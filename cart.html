<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Food Ordering System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TOP HEADER -->
    <header class="customer-header">
        <button id="menuBtn" class="header-btn">☰</button>
        <div class="header-actions">
            <button id="languageBtn" class="header-btn">🌐 EN</button>
            <button id="refreshBtn" class="header-btn">🔄</button>
            <a href="cart.html" class="header-btn">🛒 <span id="cartCount">0</span></a>
        </div>
    </header>

    <!-- SIDE DRAWER MENU -->
    <div id="sideMenu" class="side-menu">
        <button id="closeMenu">✕</button>
        <h3>Navigation</h3>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">View Cart</a>
        <a href="orders.html">My Orders</a>
        
        <div id="userLoggedInMenu" class="hidden">
            <a href="profile.html">My Profile</a>
            <button id="logoutBtn" class="side-btn logout-bg">Logout</button>
        </div>
        <div id="userLoggedOutMenu">
            <a href="login.html" class="side-btn">Login / Register</a>
        </div>
    </div>

    <!-- MAIN CART CONTENT -->
    <div class="menu-container">
        <div class="popular-section">
            <h2 class="section-title">Your Selected Items</h2>
            
            <div id="cartItemsList">
                <!-- Javascript দিয়ে কার্টের ডাটা এখানে রেন্ডার হবে -->
            </div>

            <!-- CART SUMMARY AREA -->
            <div id="cartSummary" class="hidden" style="margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 15px; text-align: right;">
                <h3>Total Amount: ৳ <span id="cartTotalPrice">0</span></h3>
                <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
                    <a href="menu.html" class="add-cart-btn" style="text-decoration: none; background: #666; display: inline-block; width: auto;">+ Add More Food</a>
                    <a href="checkout.html" class="add-cart-btn" style="text-decoration: none; background: #27ae60; display: inline-block; width: auto;">Proceed to Checkout →</a>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Food Ordering System. All rights reserved.</p>
    </footer>

    <script type="module" src="js/cart.js"></script>
</body>
</html>
